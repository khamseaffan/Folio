[project]
name = "folio-api"
version = "0.1.0"
description = "Folio personal agent API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "firebase-admin>=7.8.0",
  "psycopg[binary]>=3.3.9",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
