<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sakana system map</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1a1a1a;
      --muted: #5c6570;
      --line: #c5cad1;
      --paper: #ffffff;
      --wash: #f3f5f7;
      --box: #f7f8fa;
      --selected: #1c3f73;
      --note: #f4efe4;
      --note-line: #d9c7a3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: 0;
    }
    .lede {
      margin: 0 0 18px;
      color: var(--muted);
    }
    .map {
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }
    .part { cursor: pointer; }
    .detail {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .detail h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 650;
    }
    .detail p { margin: 0; max-width: 68ch; }
    .note {
      margin-top: 14px;
      max-width: 68ch;
      padding: 10px 12px;
      background: var(--note);
      border: 1px solid var(--note-line);
    }
  </style>
</head>
<body>
  <main>
    <h1>System map</h1>
    <p class="lede">One region, us-central1. Click a part. The database tables are not on this map. Open this file in a browser.</p>
    <svg id="map" class="map" viewBox="0 0 1180 680" role="img" aria-label="System map of the web app, Google Cloud region, and external services"></svg>
    <section class="detail" aria-live="polite">
      <h2 id="detail-title">API</h2>
      <p id="detail-body"></p>
      <p class="note" id="detail-note" hidden></p>
    </section>
  </main>
  <script>
    const W = 156;
    const H = 58;

    const parts = [
      { id: "person", name: "Person", place: "Outside", x: 24, y: 200 },
      { id: "web", name: "Web app", place: "Vercel", x: 24, y: 340 },
      { id: "drive", name: "Drive", place: "Import only", x: 24, y: 500 },
      { id: "scheduler", name: "Scheduler", place: "Cloud Scheduler", x: 260, y: 72 },
      { id: "queue", name: "Queue", place: "Cloud Tasks", x: 500, y: 72 },
      { id: "api", name: "API", place: "Cloud Run", x: 260, y: 250 },
      { id: "worker", name: "Worker", place: "Cloud Run", x: 500, y: 250 },
      { id: "browser", name: "Browser", place: "On the worker", x: 740, y: 250 },
      { id: "postgres", name: "Postgres", place: "Cloud SQL", x: 260, y: 500, store: true },
      { id: "files", name: "Files", place: "Cloud Storage", x: 500, y: 500, store: true },
      { id: "keys", name: "Keys", place: "Cloud KMS", x: 740, y: 500, store: true },
      { id: "model", name: "Model", place: "Their provider", x: 990, y: 160 },
      { id: "publicWeb", name: "Public web", place: "Outside", x: 990, y: 340 }
    ];

    const edges = [
      { label: "request", points: [[102, 258], [102, 340]] },
      { label: "call", points: [[180, 369], [220, 369], [220, 279], [260, 279]] },
      { label: "read-only import", points: [[180, 529], [230, 529], [230, 308], [338, 308]] },
      { label: "when due", points: [[416, 101], [500, 101]] },
      { label: "enqueue", points: [[338, 250], [338, 180], [578, 180], [578, 130]] },
      { label: "deliver", points: [[578, 130], [578, 250]] },
      { label: "short chat", points: [[416, 279], [430, 279], [430, 148], [1068, 148], [1068, 160]] },
      { label: "model", points: [[578, 250], [578, 168], [990, 168]] },
      { label: "one task", points: [[656, 279], [740, 279]] },
      { label: "read or submit", points: [[896, 279], [940, 279], [940, 369], [990, 369]] },
      { label: "records", points: [[338, 308], [338, 500]] },
      { label: "bytes", points: [[578, 308], [578, 500]] },
      { label: "wrap key", points: [[338, 308], [338, 470], [818, 470], [818, 500]] },
      { label: "save result", points: [[500, 308], [480, 308], [480, 532], [416, 532]] }
    ];

    const copy = {
      person: "An invited account. Sign-in is Firebase Authentication, with Google or a magic link. The person types, or speaks and that speech becomes a message. Memory, files, Drive, research, and scheduled runs belong to this account and are not shared.",
      web: "Next.js on Vercel. It is the only surface the person uses. It calls the API. It does not hold the database, the files, or the keys.",
      drive: "A read-only import of one file the person picks in Google's picker. The copy is from that moment and is private. Later edits at the source wait for another import. The refresh token is envelope-encrypted. Disconnecting removes the token and leaves the copies.",
      api: "Cloud Run. A short chat turn runs here: it reads the profile and this account's files, calls the model, and returns the reply. Browser work, a long web read, and research are enqueued instead.",
      scheduler: "Cloud Scheduler. When a scheduled run is due, it enqueues one queue task. The run then uses the same loop as any other turn.",
      queue: "Cloud Tasks. Delivery is at least once. The run id is the identity of the report or the waiting question. A second delivery does not ask again and does not repeat a finished action.",
      worker: "Cloud Run. It runs the loop for research and for a scheduled run. It calls the platform model, may use the browser and the public web, and saves the result. A send on a website still requires a confirmation of that exact send.",
      browser: "Runs on the worker, one account task at a time. A page read does not send data. A send on a website is the only send, and it runs only for a confirmation of that exact send. A send that may already have completed is not repeated.",
      model: "The platform holds the key. The current model is Gemini. The person cannot change it. A short chat calls from the API. Research and scheduled runs call from the worker. Each call records cost. Missing usage is stored as missing.",
      publicWeb: "Read during research, and during a scheduled run when the task needs it. A send on a website still requires a confirmation of that exact send.",
      postgres: "Cloud SQL in us-central1, private IP, primary for reads and writes. This is the record of the account, the thread, the profile, the report, and the scheduled run. The tables and columns are not designed yet.",
      files: "Cloud Storage. Bytes for one account live under that account's prefix. A file is visible only after the bytes are stored and the database row commits. Uploads and task files are counted, and the count stops at 5 GB. Knowledge files and Drive copies are outside that count.",
      keys: "Cloud KMS envelope-encrypts the platform model keys and the Drive refresh token. Secret Manager holds app secrets only. Deleting an account removes the Drive token. It does not remove the platform model keys."
    };

    const notes = {
      postgres: "Schema is the next discussion. This box is the place the records live. It is not the table design."
    };

    const svg = document.getElementById("map");
    const titleEl = document.getElementById("detail-title");
    const bodyEl = document.getElementById("detail-body");
    const noteEl = document.getElementById("detail-note");
    let active = "api";

    function el(name, attrs) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attrs).forEach(function (entry) {
        node.setAttribute(entry[0], entry[1]);
      });
      return node;
    }

    function addText(parent, x, y, value, size, fill) {
      const text = el("text", { x: x, y: y, "text-anchor": "middle", fill: fill, "font-size": size });
      text.textContent = value;
      parent.appendChild(text);
    }

    function pullBack(points, dist) {
      const next = points.map(function (point) { return point.slice(); });
      const a = next[next.length - 2];
      const b = next[next.length - 1];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      next[next.length - 1] = [b[0] - (dx / len) * dist, b[1] - (dy / len) * dist];
      return next;
    }

    function labelAnchor(points) {
      let best = -1;
      let at = points[0];
      for (let i = 1; i < points.length; i += 1) {
        const dx = points[i][0] - points[i - 1][0];
        const dy = points[i][1] - points[i - 1][1];
        const len = Math.hypot(dx, dy);
        if (len > best) {
          best = len;
          at = [(points[i][0] + points[i - 1][0]) / 2, (points[i][1] + points[i - 1][1]) / 2];
        }
      }
      return at;
    }

    function arrow(x1, y1, x2, y2) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const size = 7;
      const left = angle + Math.PI * 0.82;
      const right = angle - Math.PI * 0.82;
      const ax = x2 - Math.cos(left) * size;
      const ay = y2 - Math.sin(left) * size;
      const bx = x2 - Math.cos(right) * size;
      const by = y2 - Math.sin(right) * size;
      return x2 + "," + y2 + " " + ax + "," + ay + " " + bx + "," + by;
    }

    function show(id) {
      active = id;
      const part = parts.find(function (item) { return item.id === id; });
      titleEl.textContent = part.name;
      bodyEl.textContent = copy[id];
      if (notes[id]) {
        noteEl.hidden = false;
        noteEl.textContent = notes[id];
      } else {
        noteEl.hidden = true;
        noteEl.textContent = "";
      }
      draw();
    }

    function draw() {
      svg.replaceChildren();

      const region = el("rect", {
        x: 220, y: 24, width: 720, height: 620, rx: 8,
        fill: "#f3f5f7", stroke: "#c5cad1", "stroke-dasharray": "5 4"
      });
      svg.appendChild(region);
      const regionLabel = el("text", { x: 236, y: 48, fill: "#5c6570", "font-size": 13 });
      regionLabel.textContent = "Google Cloud, us-central1";
      svg.appendChild(regionLabel);

      edges.forEach(function (edge) {
        const drawn = pullBack(edge.points, 11);
        const d = drawn.map(function (point, index) {
          return (index === 0 ? "M" : "L") + point[0] + " " + point[1];
        }).join(" ");
        svg.appendChild(el("path", { d: d, fill: "none", stroke: "#8b939c", "stroke-width": 1.25 }));
        const last = drawn[drawn.length - 1];
        const prev = drawn[drawn.length - 2];
        svg.appendChild(el("polygon", { points: arrow(prev[0], prev[1], last[0], last[1]), fill: "#8b939c" }));
        const at = labelAnchor(drawn);
        const width = edge.label.length * 6.2 + 8;
        svg.appendChild(el("rect", {
          x: at[0] - width / 2,
          y: at[1] - 14,
          width: width,
          height: 16,
          rx: 3,
          fill: "#ffffff"
        }));
        const label = el("text", {
          x: at[0],
          y: at[1] - 3,
          "text-anchor": "middle",
          fill: "#5c6570",
          "font-size": 11
        });
        label.textContent = edge.label;
        svg.appendChild(label);
      });

      parts.forEach(function (part) {
        const selected = part.id === active;
        const fill = selected ? "#1c3f73" : "#f7f8fa";
        const ink = selected ? "#ffffff" : "#1a1a1a";
        const place = selected ? "#d5deee" : "#5c6570";
        const stroke = selected ? "#1c3f73" : "#c5cad1";
        const group = el("g", { class: "part", role: "button", tabindex: "0" });
        group.appendChild(el("title", {}));
        group.querySelector("title").textContent = part.name;

        if (part.store) {
          const ry = 8;
          group.appendChild(el("rect", {
            x: part.x, y: part.y + ry, width: W, height: H - ry * 2, fill: fill, stroke: stroke
          }));
          group.appendChild(el("ellipse", {
            cx: part.x + W / 2, cy: part.y + ry, rx: W / 2, ry: ry, fill: fill, stroke: stroke
          }));
          group.appendChild(el("ellipse", {
            cx: part.x + W / 2, cy: part.y + H - ry, rx: W / 2, ry: ry, fill: fill, stroke: stroke
          }));
        } else {
          group.appendChild(el("rect", {
            x: part.x, y: part.y, width: W, height: H, rx: 6, fill: fill, stroke: stroke
          }));
        }
        addText(group, part.x + W / 2, part.y + 24, part.name, 14, ink);
        addText(group, part.x + W / 2, part.y + 42, part.place, 11, place);
        group.addEventListener("click", function () { show(part.id); });
        group.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            show(part.id);
          }
        });
        svg.appendChild(group);
      });
    }

    show("api");
  </script>
</body>
</html>
