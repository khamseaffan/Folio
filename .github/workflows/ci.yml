name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Decides which checks have anything to check. A job that is skipped reports as passed, so the
  # required checks still come back for a pull request that touches only the README.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A change to this file runs everything. If the changed files cannot be listed, so does
          # a failure here: running too much is safe, and skipping a check is not.
          workflow='^\.github/workflows/ci\.yml$'
          set +e
          files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null)
          status=$?
          set -e
          if [ "$status" -ne 0 ] || [ -z "$files" ]; then
            echo "The changed files could not be listed, so every check runs."
            backend=true; frontend=true; infra=true
          else
            echo "Changed files:"
            echo "$files"
            backend=false; frontend=false; infra=false
            echo "$files" | grep -Eq "^backend/|$workflow" && backend=true
            echo "$files" | grep -Eq "^frontend/|$workflow" && frontend=true
            echo "$files" | grep -Eq "^infra/|$workflow" && infra=true
          fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "infra=$infra"
          } >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: folio
          POSTGRES_DB: folio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folio -d folio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Cache virtualenv
        id: venv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-py3.13-${{ hashFiles('backend/uv.lock') }}
      - name: Install
        if: steps.venv.outputs.cache-hit != 'true'
        working-directory: backend
        run: uv sync --frozen --all-groups
      - name: Lint
        working-directory: backend
        run: uv run ruff check .
      - name: Test
        working-directory: backend
        run: uv run pytest

  frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('frontend/package-lock.json') }}
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
            nextjs-${{ runner.os }}-
      - name: Install
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  terraform:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.infra != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate

  docker:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build backend
      - name: Build the research image
        run: docker build -f backend/Dockerfile.research backend

  browser:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    # The test setup creates the tables for every test, so even the browser tests need a database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: folio
          POSTGRES_PASSWORD: folio
          POSTGRES_DB: folio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folio -d folio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --frozen --all-groups --group research
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Test
        run: uv run pytest tests/test_browser.py
